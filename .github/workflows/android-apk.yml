name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Generate frozen VF data module
        run: node scripts/build-frozen-data.mjs
      - name: Apply accessibility UI controls
        run: node scripts/apply-ui-prefs.mjs
      - name: TypeScript parity check
        run: npx tsc --noEmit
      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: VF-Quiniela-APK-Full
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
